server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;

    root /usr/share/nginx/html;
    index index.html;

    # Static files with hashed names can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API calls go to the Spring Boot container.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr (not $proxy_add_x_forwarded_for) so visitors cannot fake their IP to dodge rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Short links such as /aB3dE9x are redirected by the backend.
    location ~ "^/[0-9A-Za-z]{4,16}$" {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Everything else is the React single page app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
