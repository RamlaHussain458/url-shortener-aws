services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required in .env}
      MYSQL_USER: ${DB_USER:?DB_USER is required in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Short links are shown to visitors on the public address of the web container.
      APP_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # The API sits behind nginx, so read th visitor's IP from X-Forwarded-For (needed for rate limiting).
      FORWARD_HEADERS_STRATEGY: native
    ports:
      # Only reachable from this machine. Visitors go through the web container.
      - "127.0.0.1:8080:8080"
    # Container hardening
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "3000:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
