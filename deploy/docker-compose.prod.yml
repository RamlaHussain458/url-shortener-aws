# Production stack on the web server. The images come from ECR and the database is RDS,
# so there is no database service here. Values come from the .env file that deploy.sh writes.
services:
  app:
    image: ${ECR_REGISTRY:?}/url-shortener-backend:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://${DB_HOST:?}:3306/${DB_NAME:?}
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      # Short links are shown on the public address of this server.
      APP_BASE_URL: ${PUBLIC_BASE_URL:?}
      # The API sits behind nginx, so read the visitor's IP from X-Forwarded-For (needed for rate limiting).
      FORWARD_HEADERS_STRATEGY: native
    ports:
      # Reachable only from the server itself (used by the deploy health check).
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${ECR_REGISTRY:?}/url-shortener-web:${IMAGE_TAG:?}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
